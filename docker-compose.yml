version: '3.7'

services:
  db:
    image: postgres
    environment:
      - POSTGRES_DB=tr
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password1234

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment: 
      - RABBITMQ_DEFAULT_USER=trunk_player
      - RABBITMQ_DEFAULT_PASS=trunk_player
    ports:
        - 5672:5672
        - 15672:15672

  app:
    # build:
    #   context: .
    image: maxwelldps/trunk-player:latest
    ports:
      - "8080:8080"
      - ""
    volumes:
      #- .:/app/trunkplayer
      - audio:/app/trunkplayer/audio_files
    environment:
      - DEBUG=True
      - SQL_ENGINE=django.db.backends.postgresql_psycopg2
      - SQL_DATABASE=tr
      - SQL_USER=postgres
      - SQL_PASSWORD=password1234
      - SQL_HOST=db
      - RABBITMQ_URL=amqp://trunk_player:trunk_player@rabbitmq:5672
      - MIGRATE_DB=1
      - SECRET_KEY="%2%xjx4c3obf_xa8hsdbd@ci+8!4)@x16_!auo*h(%*p_z(g"
      - DJANGO_ALLOWED_HOSTS=*
      - TZ=America/Chicago
      - FORCE_SECURE=False
      - ANONYMOUS_TIME=0
      - SITE_TITLE=TESTING
      - SITE_EMAIL=no@no.io
      - AUDIO_URL_BASE=/audio_files/
      - ALLOW_ANONYMOUS=False
      - ACCESS_TG_RESTRICT=False
      - TALKGROUP_RECENT_LENGTH=0
      - OPEN_SITE=False
      - FIX_AUDIO_NAME=False
      - TRANS_DATETIME_FORMAT=%H:%M:%S %m/%d/%Y
      - GOOGLE_ANALYTICS_PROPERTY_ID=0      
    depends_on:
      - db
      - rabbitmq

volumes: 
  audio:
